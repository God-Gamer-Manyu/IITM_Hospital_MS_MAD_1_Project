<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Doctor Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=3">
  </head>
  <body>
    <header class="navbar-top d-flex align-items-center">
      <div style="flex:1; display:flex; justify-content:center; gap:0.5rem;">
        <a class="btn btn-sm btn-outline-primary" href="#appointments">Appointments</a>
        <a class="btn btn-sm btn-outline-primary" href="#patients">Patients</a>
      </div>
      <div class="nav-actions">
        <div class="profile-block d-flex align-items-center gap-2">
            <img id="profileIcon" src="{% if doctor %}{{ url_for('doctor_avatar', doctor_id=doctor.id) }}{% else %}{{ url_for('static', filename='Images/Default_Pic.webp') }}{% endif %}" alt="avatar" class="rounded" width="40" height="40">
            <form method="get" action="{{ url_for('logout') }}" class="m-0">
                <button class="btn btn-sm btn-outline-secondary">Logout</button>
            </form>
        </div>
      </div>
    </header>

    <main class="container-main">
      <section id="appointments">
        <h5>Appointments (Upcoming Week)</h5>
        <div class="booking-area">
          <div id="calendarContainer"></div>
        </div>
      </section>

      <section id="patients" class="mt-4">
        <h5>Patients</h5>
        <div class="row g-2 mb-2">
          <div class="col-md-6" style="position:relative;">
                <div class="input-group">
                  <input id="patientSearch" autocomplete="off" class="form-control" placeholder="Type patient name or id and press Enter">
                  <button id="patientDropdownToggle" class="btn btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">All</button>
                  <ul id="patientDropdown" class="dropdown-menu dropdown-menu-end" style="max-height:300px; overflow:auto;">
                    <!-- items injected here -->
                  </ul>
                </div>
                <div id="patientSuggestions" class="typeahead-suggestions" style="display:none"></div>
              </div>
          <div class="col-md-6 text-end">
            <button class="btn btn-sm btn-outline-secondary" id="refreshList">Refresh</button>
          </div>
        </div>
        <div id="patientList" class="list-group"></div>
      </section>
    </main>

    <div id="overlay" class="overlay">
      <div class="card popup-card p-3">
        <div id="popupContent"></div>
        <div class="text-end mt-3"><button class="btn btn-secondary" onclick="closePopup()">Close</button></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
  const doctor = {{ doctor_js|tojson }};
  const departments = {{ departments_js|tojson }};
  const defaultAvatarUrl = "{{ url_for('static', filename='Images/Default_Pic.webp') }}";

      // Show doctor profile popup when clicking the avatar
      const profileIconEl = document.getElementById('profileIcon');
      if(profileIconEl){
        profileIconEl.style.cursor = 'pointer';
        profileIconEl.addEventListener('click', function(){
          const avatar = (doctor && doctor.id) ? ('/doctor_avatar/' + doctor.id) : defaultAvatarUrl;
          const created = doctor && doctor.created_at ? (doctor.created_at.split('T')[0] || doctor.created_at) : '';
          const html = `
            <div class="profile-popup">
              <img src="${avatar}" class="pp-avatar" alt="avatar">
              <div class="pp-main">
                <div class="pp-name">${doctor ? (doctor.f_name + ' ' + (doctor.l_name||'')) : 'Doctor'}</div>
                <div class="pp-sub">@${doctor ? doctor.username : ''}</div>
                <div class="pp-contact">
                  <div class="pp-item">Phone: ${doctor && doctor.ph_no ? doctor.ph_no : '-'}</div>
                  <div class="pp-item">Department: ${doctor && doctor.department ? doctor.department : '-'}</div>
                  <div class="pp-item">Member since: ${created}</div>
                </div>
                <style>
                    .profile-popup { position: relative; }
                    .profile-popup .edit-profile-btn { position: absolute; top: 8px; right: 8px; }
                </style>
                <button class="btn btn-sm btn-primary edit-profile-btn" onclick="openEditProfile()">Edit Profile</button>
              </div>
            </div>`;
          document.getElementById('popupContent').innerHTML = html;
          document.getElementById('overlay').style.display = 'flex';
        });
      }

      // load calendar for this doctor
      async function loadCalendar(){
        const res = await fetch('/doctor_calendar/' + doctor.id);
        const j = await res.json();
        if(!j.ok) { document.getElementById('calendarContainer').innerText = 'Failed to load'; return; }
        renderCalendar(j.availability || []);
      }

      function renderCalendar(availability){
        const container = document.getElementById('calendarContainer'); container.innerHTML='';
        // Use the shared calendar wrapper/table classes so CSS controls sizing and scrolling
        const wrapper = document.createElement('div'); wrapper.className='calendar-wrapper';
        const table = document.createElement('table'); table.className='calendar-table';
        const times = availability.length ? availability[0].slots.map(s=>s.time) : [];
        const thead = document.createElement('thead'); const headRow = document.createElement('tr');
        const emptyTh = document.createElement('th'); emptyTh.className='date-col'; emptyTh.innerText='Date'; headRow.appendChild(emptyTh);
        times.forEach(t=>{ const th=document.createElement('th'); th.className='time-head'; th.innerText=t; headRow.appendChild(th); }); thead.appendChild(headRow); table.appendChild(thead);
        const tbody = document.createElement('tbody');
        availability.forEach(day=>{
          const tr=document.createElement('tr'); const dateTd=document.createElement('td'); dateTd.className='date-col'; dateTd.innerHTML=`<div style="font-weight:700">${day.date}</div>`; tr.appendChild(dateTd);
          day.slots.forEach(slot=>{
            const td=document.createElement('td');
            if(slot.booked){ td.className='doctor-booked'; td.innerHTML = `<div class="small"><strong>${slot.patient_id}</strong> ${slot.patient_name||''}${slot.status === 'Completed' ? ' <span class="badge bg-success ms-2">Completed</span>' : ''}</div><div><button class="btn btn-sm btn-light load-patient" data-pid="${slot.patient_id}" data-appt="${slot.appointment_id}">Load</button></div>`; }
            else { td.innerHTML = `<div class="small text-muted">Free</div>`; }
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
        table.appendChild(tbody); wrapper.appendChild(table); container.appendChild(wrapper);
        // bind load patient buttons
        document.querySelectorAll('.load-patient').forEach(b=> b.addEventListener('click', function(){ const pid=this.dataset.pid; loadPatient(pid); }));
      }

      let cachedPatients = [];
      async function loadPatients(){
        const res = await fetch('/doctor_patients/' + doctor.id);
        const j = await res.json();
        if(!j.ok) { document.getElementById('patientList').innerText='Failed'; return; }
        cachedPatients = j.patients || [];
        renderPatientList(cachedPatients);
        populatePatientDropdown(cachedPatients);
      }

      function renderPatientList(patients){
        const list = document.getElementById('patientList'); list.innerHTML='';
        patients.forEach(p=>{
          const item = document.createElement('div'); item.className='list-group-item d-flex align-items-center';
          const imgSrc = p.has_profile_pic ? '/avatar/'+p.id : defaultAvatarUrl;
          const latest = p.latest_appointment;
          let latestHtml = '';
          if(latest){
            const completeBtn = (latest.status === 'Completed') ? '' : ` <button class="btn btn-sm btn-outline-success ms-2" onclick="completeAppt(${latest.id})">Mark Complete</button>`;
            latestHtml = `<div class="small text-success">Latest: ${latest.date} ${latest.time} ${latest.status === 'Completed' ? '<span class="badge bg-success ms-2">Completed</span>' : ''}${completeBtn}</div>`;
          }
          item.innerHTML = `<img src="${imgSrc}" width="48" height="48" class="rounded me-2" style="object-fit:cover"> <div><div><strong>${p.id}</strong> ${p.f_name} ${p.l_name}</div><div class="small text-muted">${p.ph_no}</div>${latestHtml}</div><div class="ms-auto text-end"><button class="btn btn-sm btn-primary me-1" data-pid="${p.id}" onclick="viewPatient(${p.id})">View</button></div>`;
          list.appendChild(item);
        });
      }

      function populatePatientDropdown(patients){
        const ul = document.getElementById('patientDropdown'); ul.innerHTML='';
        patients.forEach(p=>{
          const li = document.createElement('li');
          li.innerHTML = `<a class="dropdown-item" href="#" data-pid="${p.id}">${p.f_name} ${p.l_name} (#${p.id})</a>`;
          ul.appendChild(li);
        });
        // attach click handlers
        ul.querySelectorAll('a.dropdown-item').forEach(a=> a.addEventListener('click', function(ev){ ev.preventDefault(); const pid=this.dataset.pid; viewPatient(pid); }));
      }

      // filter dropdown as user types
      document.getElementById('patientSearch').addEventListener('input', function(e){
        const q = this.value.trim().toLowerCase();
        const ul = document.getElementById('patientDropdown');
        if(!q){ // show all
          ul.querySelectorAll('li').forEach(li=> li.style.display='');
          return;
        }
        ul.querySelectorAll('li').forEach(li=>{
          const txt = li.textContent.toLowerCase();
          li.style.display = txt.includes(q) ? '' : 'none';
        });
      });

      function showSuggestions(query){
        const box = document.getElementById('patientSuggestions');
        if(!query){ box.style.display='none'; box.innerHTML=''; return; }
        const q = query.toLowerCase();
        const matches = cachedPatients.filter(p => (`${p.f_name} ${p.l_name}`).toLowerCase().startsWith(q) || (`${p.l_name} ${p.f_name}`).toLowerCase().startsWith(q));
        if(matches.length === 0){ box.style.display='none'; box.innerHTML=''; return; }
        box.innerHTML = matches.slice(0,10).map(p=>`<div class="typeahead-item" data-pid="${p.id}"><strong>${p.f_name} ${p.l_name}</strong> <small class="text-muted">(#${p.id})</small></div>`).join('');
        box.style.display='block';
        // bind clicks
        box.querySelectorAll('.typeahead-item').forEach(el => el.addEventListener('click', function(){ const pid=this.dataset.pid; document.getElementById('patientSearch').value = this.textContent.trim(); box.style.display='none'; viewPatient(pid); }));
      }

      // hide suggestions on outside click
      document.addEventListener('click', function(e){ const box=document.getElementById('patientSuggestions'); const inp=document.getElementById('patientSearch'); if(!box.contains(e.target) && e.target !== inp){ box.style.display='none'; } });

      async function loadPatient(pid){
        const res = await fetch('/patient_appointments/' + pid);
        const j = await res.json();
        if(!j.ok){ alert(j.error||'Failed'); return; }
        // render popup list of appointments
        let html = `<h5>Appointments for ${j.patient.f_name} ${j.patient.l_name}</h5>`;
        html += '<div class="list-group">';
        j.appointments.forEach(a=>{
          const markBtn = (a.status === 'Completed') ? '' : `<button class="btn btn-sm btn-success me-1" onclick="completeAppt(${a.id})">Mark Complete</button>`;
          html += `<div class="list-group-item d-flex justify-content-between align-items-center"><div><strong>${a.date} ${a.time}</strong><div class="small">Status: ${a.status} ${a.status === 'Completed' ? '<span class="badge bg-success ms-2">Completed</span>' : ''}</div></div><div>${markBtn}<button class="btn btn-sm btn-outline-primary" onclick="viewTreatment(${a.id})">View</button></div></div>`;
        });
        html += '</div>';
        document.getElementById('popupContent').innerHTML = html; document.getElementById('overlay').style.display='flex';
      }

      async function viewPatient(pid){ loadPatient(pid); }

      async function completeAppt(apptId){ if(!confirm('Mark appointment as completed?')) return; const res=await fetch('/appointment/'+apptId+'/complete',{method:'POST'}); const j=await res.json(); if(j.ok){ alert('Marked complete'); location.reload(); } else alert(j.error||'Failed'); }

      async function viewTreatment(apptId){ const res=await fetch('/appointment/'+apptId+'/details'); const j=await res.json(); if(!j.ok) { alert(j.error||'Failed'); return; }
        // show treatment in popup with edit
        let html = `<h5>Treatment</h5><div><strong>Diagnosis</strong><div>${j.diagnosis||'-'}</div></div><div class="mt-2"><strong>Prescription</strong><div>${j.prescription||'-'}</div></div><div class="mt-2"><strong>Notes</strong><div>${j.notes||'-'}</div></div><div class="mt-3"><button class="btn btn-primary" onclick="editTreatment(${apptId})">Edit</button></div>`;
        document.getElementById('popupContent').innerHTML = html; document.getElementById('overlay').style.display='flex';
      }

      function openEditProfile(){
        // Build edit form with limited editable fields: first name, last name, phone, profile pic
        const deptOptions = (departments||[]).map(d => `<option value="${d.id}" ${doctor && doctor.department && d.department_name===doctor.department ? 'selected' : ''}>${d.department_name}</option>`).join('');
        const deptSelect = `<select class="form-select" disabled>${deptOptions}</select>`;
        const html = `
          <div class="edit-form-wrapper" style="position:relative;">
            <h5>Edit Profile</h5>
            <div class="edit-form-actions" style="position:absolute; top:8px; right:8px; display:flex; gap:0.5rem; z-index:5;">
              <button class="btn btn-primary btn-sm" onclick="submitDoctorProfileEdit()">Save</button>
              <button class="btn btn-secondary btn-sm" onclick="profileIconEl.click()">Cancel</button>
            </div>

            <div class="mb-2">First name:<br><input id="edit_f" class="form-control" value="${doctor ? (doctor.f_name||'') : ''}"></div>
            <div class="mb-2">Last name:<br><input id="edit_l" class="form-control" value="${doctor ? (doctor.l_name||'') : ''}"></div>
            <div class="mb-2">Phone:<br><input id="edit_ph" class="form-control" value="${doctor ? (doctor.ph_no||'') : ''}"></div>
            <div class="mb-2">Department:<br>${deptSelect}</div>
            <div class="mb-2">Profile picture:<br><input id="edit_pic" type="file" accept="image/*" class="form-control"></div>
          </div>
        `;
        document.getElementById('popupContent').innerHTML = html; document.getElementById('overlay').style.display='flex';
      }

      async function submitDoctorProfileEdit(){
        const f = document.getElementById('edit_f').value.trim();
        const l = document.getElementById('edit_l').value.trim();
        const ph = document.getElementById('edit_ph').value.trim();
        if(!f || !l || !ph){ alert('First name, last name and phone are required'); return; }
        if(!/^[0-9]+$/.test(ph)){ alert('Phone must be numeric'); return; }
        const fd = new FormData();
        fd.append('f_name', f);
        fd.append('l_name', l);
        fd.append('ph_no', ph);
        const fileInput = document.getElementById('edit_pic');
        if(fileInput && fileInput.files && fileInput.files.length>0) fd.append('profile_pic', fileInput.files[0]);

        const res = await fetch('/doctor_update_profile', { method: 'POST', body: fd });
        const j = await res.json();
        if(!j.ok){ alert(j.error||'Failed to update'); return; }
        // update local doctor object and header avatar
        if(j.doctor) {
          Object.assign(doctor, j.doctor);
          const newSrc = (doctor && doctor.id) ? ('/doctor_avatar/' + doctor.id + '?v=' + Date.now()) : defaultAvatarUrl;
          document.getElementById('profileIcon').src = newSrc;
        }
        // re-open readonly profile to show updated values
        profileIconEl.click();
      }

      function closePopup(){ document.getElementById('overlay').style.display='none'; }

      async function editTreatment(apptId){
        // simple edit form
        const res = await fetch('/appointment/'+apptId+'/details'); const j=await res.json();
        let html = `<h5>Edit Treatment</h5><div class="mb-2">Diagnosis:<br><textarea id="t_diag" class="form-control">${j.diagnosis||''}</textarea></div><div class="mb-2">Prescription:<br><textarea id="t_rx" class="form-control">${j.prescription||''}</textarea></div><div class="mb-2">Notes:<br><textarea id="t_notes" class="form-control">${j.notes||''}</textarea></div><div class="text-end"><button class="btn btn-primary" onclick="saveTreatment(${apptId})">Save</button></div>`;
        document.getElementById('popupContent').innerHTML = html;
      }

      async function saveTreatment(apptId){
        const data = {diagnosis: document.getElementById('t_diag').value, prescription: document.getElementById('t_rx').value, notes: document.getElementById('t_notes').value};
        const res = await fetch('/treatment/'+apptId+'/edit',{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)});
        const j=await res.json();
        if(j.ok){
          // Re-fetch and show the updated treatment details in the popup so the user sees saved changes
          await viewTreatment(apptId);
        } else {
          alert(j.error||'Failed');
        }
      }

      document.getElementById('patientSearch').addEventListener('keydown', function(e){ if(e.key==='Enter'){ const q=this.value.trim(); if(!q) loadPatients(); else { // try numeric id first
            if(/^[0-9]+$/.test(q)){ viewPatient(Number(q)); } else { // prefix search by name
              // find matching patient by name via /doctor_patients and filter
              fetch('/doctor_patients/'+doctor.id).then(r=>r.json()).then(j=>{ if(!j.ok) return; const found = j.patients.filter(p => (p.f_name + ' ' + p.l_name).toLowerCase().startsWith(q.toLowerCase())); const list=document.getElementById('patientList'); list.innerHTML=''; found.forEach(p=>{ const item = document.createElement('div'); item.className='list-group-item d-flex align-items-center'; const imgSrc = p.has_profile_pic ? '/avatar/'+p.id : defaultAvatarUrl; item.innerHTML = `<img src="${imgSrc}" width="48" height="48" class="rounded me-2" style="object-fit:cover"> <div><div><strong>${p.id}</strong> ${p.f_name} ${p.l_name}</div><div class="small text-muted">${p.ph_no}</div></div><div class="ms-auto text-end"><button class="btn btn-sm btn-primary me-1" data-pid="${p.id}" onclick="viewPatient(${p.id})">View</button></div>`; list.appendChild(item); }); }); } } } });

      document.getElementById('refreshList').addEventListener('click', loadPatients);

      // init
      loadCalendar(); loadPatients();
    </script>
  </body>
</html>
