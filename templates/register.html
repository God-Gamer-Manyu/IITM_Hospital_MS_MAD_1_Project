<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=2">
  </head>
  <body>
    <main class="container">
      <div class="card card-login">
        <div class="card-body p-4 card-body--center">
          <div class="text-center mb-4">
            <h2 class="brand">Register</h2>
            <p class="text-muted small">Create a new patient account</p>
          </div>

          {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
              {% for category, message in messages %}
                {% set bs_class = 'danger' if category == 'error' else category %}
                <div class="alert alert-{{ bs_class }}" role="alert">{{ message }}</div>
              {% endfor %}
            {% endif %}
          {% endwith %}

          <form method="post" action="{{ url_for('register') }}" enctype="multipart/form-data">
            <div class="mb-2 form-floating">
              <input type="text" class="form-control" id="username" name="username" placeholder="username" required>
              <label for="username">email address</label>
            </div>

            <div class="mb-2 form-floating">
              <input type="password" class="form-control" id="password" name="password" placeholder="password" required>
              <label for="password">Password</label>
            </div>

            <div class="mb-2 form-floating">
              <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="confirm password" required>
              <label for="confirm_password">Confirm Password</label>
            </div>

            <div class="mb-2 form-floating">
              <input type="text" class="form-control" id="f_name" name="f_name" placeholder="First name" required>
              <label for="f_name">First name</label>
            </div>

            <div class="mb-2 form-floating">
              <input type="text" class="form-control" id="l_name" name="l_name" placeholder="Last name" required>
              <label for="l_name">Last name</label>
            </div>

            <div class="mb-3 form-floating">
              <input type="tel" class="form-control" id="ph_no" name="ph_no" placeholder="Phone number" required>
              <label for="ph_no">Phone number</label>
            </div>

            <div class="mb-3">
              <label for="profile_pic" class="form-label small">Profile picture (optional)</label>
              <input class="form-control" type="file" id="profile_pic" name="profile_pic" accept="image/*">
            </div>

            <div class="d-grid gap-2">
              <button class="btn btn-primary btn-lg" type="submit">Register</button>
              <a class="btn btn-outline-secondary btn-lg" href="{{ url_for('login_page') }}">Back to Login</a>
            </div>
          </form>
        </div>
      </div>
    </main>
  </body>
  </html>
